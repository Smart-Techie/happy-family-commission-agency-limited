<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Malc Nexus Wealth Network - Community savings and investment platform for agricultural and real estate investments.">
    <meta name="keywords" content="savings, investment, agriculture, real estate, Nigeria, wealth creation">
    <meta name="author" content="Malc Nexus Technologies Ltd">
    <meta property="og:title" content="Malc Nexus Wealth Network">
    <meta property="og:description" content="Save together, grow together">
    <meta property="og:type" content="website">
    <title>Malc Nexus - Member Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo" style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: #0f4c5c;">MALC NEXUS</h1>
                <span>Wealth Network</span>
            </div>
           
            <h2>Member Login</h2>
           
            <div class="login-tabs">
                <button class="tab-btn active" onclick="switchTab('member')">Member</button>
                <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
            </div>
           
            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin()">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
               
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
               
                <div class="form-group" id="adminCodeGroup" style="display: none;">
                    <label>Admin Code</label>
                    <input type="password" id="adminCode" placeholder="Enter admin code">
                </div>
               
                <button type="submit" class="btn-submit">Login to Dashboard</button>
            </form>
           
            <p style="text-align: center; margin-top: 2rem;">
                Don't have an account? <a href="index.html#signup" style="color: #1e6f5c;">Join Now</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
